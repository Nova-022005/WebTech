 <script>
    const requestUrl='https://api.github.com/users/Nova-022005'
    const xhr = new XMLHttpRequest(); // AJAX request creating a object.
    // open has two para, method : type of request and string .
    xhr.open('GET',requestUrl)// for sending request
    xhr.onreadystatechange=function(){
      console.log(xhr.readyState);
      if(xhr.readyState===4){
        const data=JSON.parse(this.responseText);
        console.log(data)
        console.log(data.followers);
      }
    } 
     
     
    xhr.send()
 </script>
