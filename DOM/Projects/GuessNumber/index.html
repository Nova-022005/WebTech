<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Number||chaiaurcode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <form>
      <h2 id="label">Guess the Number Game</h2>
      <p class="instruction">Try to guess a number between 1 to 100.</p>
      <p class="instruction">For every right guess you get one point. </p>

      <label for="Number">Guess a Number </label>
      <input type="text"  id="guess" placeholder="  eg: 13">

      <button type="submit" class="button" id="submit">Check</button>
<div class="resultPara">

      <div class="record" id="previous">Previous Guess: </div>

      <div class="record" id="left">Guesses left: <span id="remaining"></span></div>

      <div id="result"></div>
</div>
    </form>
  </div>
  <script src="chaiaurcode.js"></script>
</body>
</html>
